# Windows File Explorer App Pack — v0.2 format.
#
# Explorer's accessibility tree is deep and version-dependent, so this pack is
# deliberately conservative: it names the items in the current folder and the
# primary navigation, and leaves everything else to generic mode.
#
# Matching is by process only. The window title is the current path, which
# changes on every navigation, so it must never drive identity (dev doc §8).
app:
  id: explorer
  version: "0.2.0"
  match:
    process: "explorer.exe"

projection:
  # The ribbon / command bars are large and mostly static chrome.
  - { select: "role=toolbar", rule: "collapse" }
  - { select: "role=statusbar", rule: "collapse" }
  - { select: "role=menubar", rule: "collapse" }

named_refs:
  items_view:
    role: list
    patterns: [selection]

entities:
  # One row in the file/folder view: a selectable list item with a display name.
  # Its `activate`/`select` capabilities come from the native Invoke/SelectionItem
  # patterns and need no pack declaration.
  file:
    match:
      role: listitem
      has_name: true
    key: "$self.name"
    attrs:
      name: "$self.name"
      kind:
        from: "$self.value"
        default: file

  # The current folder: the item view container. `count` is the number of
  # realised rows; Explorer virtualises large folders, so this may be a lower
  # bound (dev doc section 13).
  folder:
    match:
      role: list
      patterns: [selection]
    key: "$self.automation_id"
    attrs:
      name: "$self.name"
