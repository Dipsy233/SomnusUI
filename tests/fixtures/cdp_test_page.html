<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>SomnusUI CDP 写入测试</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 40px; }
    h1 { font-size: 18px; }
    /* 模拟 QQ 的 ProseMirror：contenteditable，没有 .value */
    #editor {
      border: 1px solid #999; min-height: 80px; padding: 8px;
      width: 480px; outline: none;
    }
    #editor[data-empty]::before {
      content: "在此输入…"; color: #aaa;
    }
    #plain { width: 480px; padding: 6px; margin-top: 12px; }
    #log { margin-top: 20px; font-size: 12px; color: #333;
           white-space: pre-wrap; border-top: 1px dashed #ccc; padding-top: 8px; }
    #reflected { margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>CDP 写入测试</h1>

  <p>1) contenteditable（模拟 QQ 的 ProseMirror 输入框）</p>
  <div id="editor" contenteditable="true" role="textbox"
       aria-label="消息输入框" data-empty="1"></div>

  <p>2) 普通 input（对照）</p>
  <input id="plain" type="text" aria-label="普通输入框">

  <div id="reflected">反射值：<span id="mirror">（空）</span></div>
  <pre id="log"></pre>

<script>
  // 用真实的 input 事件来证明"事件确实触发了"，就像 ProseMirror 那样
  const logEl = document.getElementById('log');
  const mirror = document.getElementById('mirror');
  const editor = document.getElementById('editor');
  const plain = document.getElementById('plain');

  function log(msg) {
    logEl.textContent += msg + "\n";
  }

  editor.addEventListener('input', () => {
    editor.removeAttribute('data-empty');
    mirror.textContent = JSON.stringify(editor.textContent);
    log('editor input -> ' + JSON.stringify(editor.textContent));
  });

  plain.addEventListener('input', () => {
    mirror.textContent = JSON.stringify(plain.value);
    log('plain input -> ' + JSON.stringify(plain.value));
  });

  // 暴露当前内容，给测试脚本读回
  window.__readEditor = () => editor.textContent;
  window.__readPlain = () => plain.value;
  window.__clear = () => {
    editor.textContent = '';
    editor.setAttribute('data-empty', '1');
    plain.value = '';
    mirror.textContent = '（空）';
    logEl.textContent = '';
  };

  log('页面已就绪');
</script>
</body>
</html>
