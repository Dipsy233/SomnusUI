<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>SomnusUI CDP 测试页</title></head>
<body>
  <h1>登录</h1>
  <form id="login">
    <label for="user">用户名</label>
    <input id="user" name="user" type="text" placeholder="请输入用户名">
    <label for="pwd">密码</label>
    <input id="pwd" name="pwd" type="password" placeholder="请输入密码">
    <label><input id="remember" type="checkbox"> 记住我</label>
    <button id="submit" type="button">登录</button>
  </form>
  <label for="volume">音量</label>
  <input id="volume" type="range" min="0" max="100" value="30">
  <select id="city">
    <option>北京</option>
    <option>上海</option>
    <option>广州</option>
  </select>
  <p id="status">未登录</p>
  <a href="#help">帮助</a>
  <script>
    document.getElementById('submit').addEventListener('click', () => {
      const u = document.getElementById('user').value;
      document.getElementById('status').textContent = u ? `已登录：${u}` : '用户名不能为空';
    });
    document.getElementById('user').addEventListener('input', e => {
      document.getElementById('status').textContent = '输入中：' + e.target.value;
    });
  </script>
</body>
</html>
